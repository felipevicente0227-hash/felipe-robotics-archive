name: repo checks

# Runs on Linux, where paths are case-sensitive exactly as they are on
# github.com. That is deliberate: a link with the wrong capitalisation
# resolves fine on a Windows machine and 404s for everyone else.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check README links and project structure
        run: python tools/check_repo.py
